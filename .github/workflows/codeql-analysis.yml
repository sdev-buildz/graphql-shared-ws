name: CodeQL Analysis

on:
  pull_request:
    branches: [main]

permissions:
  actions: read # Required for CodeQL to fetch telemetry/workflow run info
  contents: read # Required to checkout the code
  security-events: write # Required to upload CodeQL SARIF results to security tab

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize
        # v4
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          queries: security-and-quality

      - name: Perform analysis
        # v4
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
